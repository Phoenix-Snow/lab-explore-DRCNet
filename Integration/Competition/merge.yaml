# 时间上, 以同一站点的28连续天为长度, 切出数据集, 按每个站点一年多的数据来算, 每个站点大约贡献360条数据, 一共使用12个站点2023年的数据, 共计360*12=4320条数据
# 空间上, 以数据集中站点编号获取站点坐标, 并以坐标点为原点, 取周围100*100的数据, 完成时空数据集的创建
